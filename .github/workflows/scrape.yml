name: Scrape Flights

on:
  schedule:
    - cron: '0 14 * * *' # Once daily at 14:00 UTC (8am MDT / 7am MST)
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Save previous flight data
        run: cp public/flights.json /tmp/flights-old.json 2>/dev/null || true

      - name: Scrape flights
        env:
          MYIDTRAVEL_COMPANY: ${{ secrets.MYIDTRAVEL_COMPANY }}
          MYIDTRAVEL_USERNAME: ${{ secrets.MYIDTRAVEL_USERNAME }}
          MYIDTRAVEL_PASSWORD: ${{ secrets.MYIDTRAVEL_PASSWORD }}
        run: node scrape.js

      - name: Notify new US flights
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node notify.js /tmp/flights-old.json public/flights.json

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/flights.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update flight data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't fire the deploy workflow's
      # `on: push` trigger, so dispatch it explicitly.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
